# Local development services. `docker compose up -d db`
# Later phases add api, worker, ui and a "demo" profile (Keycloak + seeded Northwind data).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: triaged
      POSTGRES_PASSWORD: triaged  # local development only
      POSTGRES_DB: triaged
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triaged -d triaged"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
